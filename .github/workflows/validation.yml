name: Repository 5 validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Uniform regression tests
        run: python3 -m unittest discover -s code -p 'test_*.py' -v
      - name: Uniform endpoint reports
        run: |
          set -o pipefail
          python3 code/equilibrium.py 0.50 | tee uniform-h050.txt
          python3 code/equilibrium.py 0.74 | tee uniform-h074.txt
      - name: Seeded three-type property checks
        run: |
          set -o pipefail
          python3 code/discrete_check.py 20000 | tee discrete-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economic-validation
          path: |
            uniform-h050.txt
            uniform-h074.txt
            discrete-check.txt
  lean-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extra/lean-sandbox
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - name: Compile discrete sandbox
        run: lake build
      - name: Verify the 12 discrete theorem endpoints and their axiom dependencies
        run: |
          set -o pipefail
          lake env lean IdeTalamas/Discrete.lean | tee lean-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('lean-axioms.log').read_text()
          matches = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log, re.S)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          expected = {'span_strict_anti', 'bottom_gains_iff', 'share_identity', 'top_loses',
                      'no_positive_profit_tA₁', 'no_positive_profit_21',
                      'no_positive_profit_bA₃', 'no_positive_profit_31',
                      'no_positive_profit_one_layer', 'no_positive_profit_same_type',
                      'affine_le_of_le', 'mixed_firm_no_gain'}
          found = {name.rsplit('.', 1)[-1] for name, _ in matches}
          if len(matches) != 12 or found != expected:
              raise SystemExit(f'Unexpected axiom-audit endpoints: {found}')
          for name, axioms in matches:
              deps = {a.strip() for a in axioms.split(',') if a.strip()}
              if not deps <= allowed:
                  raise SystemExit(f'{name}: unexpected axioms {deps - allowed}')
          print('All 12 named theorem endpoints use only allowed Lean foundations.')
          PY
      - name: Compile independent checks against the frozen generated model
        run: |
          set -o pipefail
          mkdir -p IT25KnowledgeEconomy .lake/build/lib/lean/IT25KnowledgeEconomy
          for f in SourceModel Assumptions PaperInterface; do
            cp "../../lean/$f.lean" "IT25KnowledgeEconomy/$f.lean"
            cmp "../../lean/$f.lean" "IT25KnowledgeEconomy/$f.lean"
            lake env lean -o ".lake/build/lib/lean/IT25KnowledgeEconomy/$f.olean" "IT25KnowledgeEconomy/$f.lean"
          done
          lake env lean SourceChecks.lean | tee source-checks.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('source-checks.log').read_text()
          matches = re.findall(r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)", log, re.S)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          expected = {'feasible_wage_free', 'no_labor_income_maximizer',
                      'nonautonomous_rent_zero_of_idle', 'autonomous_rent_eq_of_independent',
                      'nonautonomous_assisted_wage', 'resource_income_max_of_efficiency',
                      'nonautonomous_wage_floor', 'bottom_strict_gain_of_capability',
                      'feasible_matching_extension', 'equilibrium_matching_extension',
                      'no_unique_nonautonomous_equilibrium'}
          found = {name.rsplit('.', 1)[-1] for name, _ in matches}
          if len(matches) != len(expected) or found != expected:
              raise SystemExit(f'Unexpected source-check endpoints: {found}')
          for name, axioms in matches:
              deps = {a.strip() for a in axioms.split(',') if a.strip()}
              if not deps <= allowed:
                  raise SystemExit(f'{name}: unexpected axioms {deps - allowed}')
          print('All independent source-model audit endpoints checked.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discrete-lean-axioms
          path: |
            extra/lean-sandbox/lean-axioms.log
            extra/lean-sandbox/source-checks.log
